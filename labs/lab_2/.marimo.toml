[ai]
# AI use is not permitted in EE 66 labs. This is the proposed UI guard.
# Supported by marimo 0.23.9+. On 0.18 this is harmless but may not hide the AI UI.
enabled = false

[completion]
# Keep third-party AI completion integrations disabled as well.
copilot = false

[runtime]
# Render markdown, hints, and answer boxes when the notebook opens in edit mode.
auto_instantiate = true
on_cell_change = "autorun"
